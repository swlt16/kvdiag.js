<!DOCTYPE html>
<html lang="de">

<head>
    <title>kvdiag.js Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8" />

    <!-- Your existing styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="kvdiag.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>

    <!-- Your existing script -->
    <script src="kvdiag.js"></script>
</head>

<body class="min-vh-100 d-flex flex-column bg-body-tertiary">
    <!-- Header -->
    <header class="border-bottom bg-body">
        <div class="container py-3">
            <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div>
                    <h1 class="h4 mb-1">KV-Diagramm Zeichenhilfe</h1>
                    <div class="text-body-secondary small">
                        Einführung in die Technische Informatik (TI1)
                    </div>
                </div>

                <a class="btn btn-outline-primary btn-sm" href="https://github.com/swlt16/kvdiag.js" target="_blank"
                    rel="noopener noreferrer">
                    Quelltext auf GitHub
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow-1">
        <div class="container py-4 py-md-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-10 col-xl-9">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white fw-semibold">
                            KV-Diagramm
                        </div>
                        <div class="card-body p-3 p-md-4">
                            <div id="kvcontainer" class="border rounded p-2 p-md-3 bg-body">
                                please enable javascript
                            </div>

                            <p class="mb-3">
                                Dies ist nur eine Zeichenhilfe, keine Lösungshilfe!
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-top bg-body">
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="small text-body-secondary">
                    &copy; 2026 Sebastian Walter
                </div>
                <div class="small">
                    Universität Tübingen
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Init kvdiag
        kvdiag = new KvDiag(document.getElementById("kvcontainer"));
        kvdiag.init();
    </script>
</body>

</html>
